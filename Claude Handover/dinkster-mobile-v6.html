 resume(){S.tab='play';S.flow='score';render()},
 copy(){toast('D code '+S.code+' copied. Share it so others can join.')},
 fmt(d){S.cfg.fmt=d.v;S.cfg.ea=null;S.cfg.eb=null;render()},to(d){S.cfg.to=+d.v;render()},bo(d){S.cfg.bo=+d.v;render()},gm(d){S.cfg.gm=d.v;render()},
 simjoin(d){const p=PL.find(x=>!S.slots.some(y=>y&&y.n===x.n))||PL[2];S.slots[+d.v]={n:p.n,d:p.d};toast(p.n+' joined with '+S.code+'.');render()},
 gform(){S.gform=true;render()},
 addguest(){const i=$('#gname');const n=i&&i.value.trim();if(!n)return toast('Enter the guest name.');const k=S.slots.findIndex((s,x)=>!s&&x<(S.cfg.fmt==='doubles'?4:2));if(k<0){S.gform=false;return toast('Lobby is full.')}S.slots[k]={n,d:3.0,guest:true};S.gform=false;render()},
 skiptoss(){S.host=true;newGame(0);S.flow='score';render()},
 doJoin(){S.flow='jlobby';render()},
 hostStart(){S.host=false;S.cfg.ea='AJ & MR';S.cfg.eb='JC & SK';newGame(0);S.flow='score';render()},
 tpick(d){S.toss.pick=d.v;render()},
 flip(){const r=Math.random()<.5?'Heads':'Tails';const c=$('#coin');if(c)c.style.transform='rotateY(1080deg)';setTimeout(()=>{S.toss.res=r;S.toss.win=S.toss.pick===r?0:1;render()},1000)},
 tchoice(d){const w=S.toss.win,first=d.v==='serve'?w:1-w;newGame(first);S.flow='score';render();toast(tn()[first]+' serves first.')},
 rally(d){rally(+d.v);render();if(S.G.over)endSheet()},
 undo(){if(S.undo.length){S.G=JSON.parse(S.undo.pop());render()}},
 sideout(){const g=S.G;S.undo.push(JSON.stringify(g));g.srv=1-g.srv;g.sn=1;g.souts++;render()},
 dimsw(){S.G.swb=false;render()},dimset(){S.G.setUp=false;render()},
 shot(){S.G.shots++;render()},shot0(){S.G.shots=0;render()},outby(d){A.rally({v:String(1-+d.v)})},
 override(){const g=S.G;sheet(`<h2 style="margin-top:0">Host override</h2><p>Scores update for everyone without a notice. Use it to fix a mistake.</p>${[0,1].map(i=>`<div class="row sp" style="margin:12px 0"><b>${g.n[i]}</b><div class="row"><button class="btn sm ghost" data-a="ovs" data-i="${i}" data-v="-1" aria-label="Minus one">-</button><b id="os${i}" style="min-width:24px;text-align:center">${g.cur[i]}</b><button class="btn sm ghost" data-a="ovs" data-i="${i}" data-v="1" aria-label="Plus one">+</button></div></div>`).join('')}<button class="btn" style="width:100%" data-a="ovsave">Save score</button>`)},
 ovs(d){const g=S.G;g.cur[+d.i]=Math.max(0,g.cur[+d.i]+ +d.v);$('#os'+d.i).textContent=g.cur[+d.i]},
 ovsave(){closeSheet();endCheck();render();toast('Score updated. Other players see the new score with no notice.');if(S.G.over)endSheet()},
 leave(){S.flow='main';render()},
 endgo(){closeSheet();S.flow='main';S.G=null;render()},
 rematch(){closeSheet();S.flow='toss';S.toss={pick:null,res:null,win:null};render()},
 close(){closeSheet()},ovclose(d,e){if(e.target.classList.contains('ov'))closeSheet()},toast(d){toast(d.v)},
 watch(){watchSheet()},wv(d){watchSheet(d.v)},
 wp(d){if(!S.G){S.cfg.ea=null;S.cfg.eb=null;newGame(0)}rally(+d.v);watchSheet();render()},
 wundo(){A.undo();watchSheet()},
 dmode(d){S.dc.mode=d.v;render()},df(d){S.dc.f=d.v;S.dc.i=0;render()},dreset(){S.dc.i=0;render()},
 pass(){S.dc.i++;render()},
 like(){const p=dlist()[S.dc.i];if(!p)return;S.dc.i++;if(p.likes)doMatch(p);else{toast(`Sent to ${p.n}. We will tell you if they like you back.`);render()}},
 superm(){const p=dlist()[S.dc.i];if(!p)return;S.dc.i++;if(p.likes)doMatch(p);else{toast(`Super match sent. ${p.n} sees you first.`);render()}},
 likeN(d){const p=PL.find(x=>x.n===d.v);doMatch(p)},
 joingame(d){S.og[+d.v]=true;toast(`Request sent to ${OG[+d.v].h}. You will get a push when you are in.`);render()},
 chat(d){closeSheet();const c=S.crew.find(x=>x.n===d.v);if(c)c.unread=false;S.tab='crew';S.cv=d.v;render()},chatback(){S.cv=null;render()},
 qmsg(d){sendMsg(d.v)},msgsend(){const i=$('#msgin');if(i&&i.value.trim())sendMsg(i.value.trim())},
 propose(d){closeSheet();sheet(`<div class="row sp"><h2 style="margin:0">Propose a game</h2><button data-a="close" aria-label="Close">${ic('x')}</button></div><p style="margin:6px 0 10px">Pick a time and place for you and ${d.v}. A D code is sent with it.</p>${SUG.map((x,i)=>`<button class="card" style="width:100%;text-align:left" data-a="sendprop" data-v="${d.v}" data-i="${i}"><h3>${x[0]}</h3><p>${x[1]}, ${x[2]}</p></button>`).join('')}`)},
 sendprop(d){closeSheet();const c=crewOf(d.v),x=SUG[+d.i];c.prop={w:x[0],v:x[1],by:1,acc:false};c.st='proposed';c.msgs.push({m:1,t:`Want to play ${x[0]} at ${x[1]}? Code D-7741.`});S.tab='crew';S.cv=d.v;render();
  setTimeout(()=>{c.prop.acc=true;c.st='planned';c.msgs.push({m:0,t:'Count me in.'});if(S.tab==='crew'&&S.cv===d.v)render();toast(`<b>${d.v} accepted.</b> D-7741 is ready.`,true)},1600)},
 accprop(d){const c=crewOf(d.v);c.prop.acc=true;c.st='planned';c.msgs.push({m:1,t:'Works for me!'});render();toast('Game planned. D-7741 is ready.')},
 startwith(d){const p=PL.find(x=>x.n===d.v)||{d:3.5};closeSheet();S.slots=[{n:'Alex Johnson',d:3.5,host:true},{n:d.v,d:p.d},null,null];S.cfg.ea=null;S.cfg.eb=null;S.host=true;S.tab='play';S.flow='lobby';render()},
 addcrew(){S.newConn++;S.met++;toast('Added to your crew.')},
 ctseg(d){S.ct.seg=d.v;render()},benf(d){S.ct.ben=d.v;S.ct.es=null;render()},es(d){S.ct.es=S.ct.es===d.v?null:d.v;render()},
 cf(d){S.ct.f=d.v;render()},claim(d){S.ct.claimed[+d.v]=!S.ct.claimed[+d.v];toast(S.ct.claimed[+d.v]?'Court claimed for 90 minutes. Others see it as taken.':'Claim released.');render()},
 pick(d){S.ct.sel=+d.v;S.ct.bk.slot=null;render();sheet(courtSheet(+d.v))},
 bk(d){S.ct.bk[d.k]=d.k==='dur'?+d.v:d.v;sheet(courtSheet(S.ct.sel))},
 book(d){const c=CT[+d.v],B=S.ct.bk,sl=SLOT.find(s=>s[0]===B.slot),rate=c.r+(sl[1])*(c.r2-c.r)/6,tot=+(rate*B.dur*1.1).toFixed(2);
  const b={n:c.n+' Court 2',d:B.d,s:B.slot,h:B.dur,tot:tot.toFixed(2),id:'BK-'+(4000+Math.floor(Math.random()*5999))};S.bookings.push(b);S.ct.bk.slot=null;render();confirmSheet(b)},
 startlobby(){closeSheet();A.flow({v:'lobby'})},
 mode(d){S.mode=d.v;S.ct.seg='find';render()},
 copilot(){copilotSheet()},ask(d){chat(d.v)},send(){const i=$('#ci');if(i&&i.value.trim())chat(i.value.trim())},
 submitScore(){const p=S.pending;if(!p)return;S.H.unshift({vs:p.opp,r:p.res,sc:p.sets.map(s=>s.join('-')).join(', '),w:'Now',k:p.court?'Court '+p.court:'Casual',y:'Waiting for confirmation'});S.chat.push({b:1,h:'Submitted. The other side and the host can confirm. DUPR syncs after confirmation.'});S.pending=null;copilotSheet();render()},
};
const crewOf=n=>{let c=S.crew.find(x=>x.n===n);if(!c){c={n,st:'new',msgs:[]};S.crew.unshift(c)}return c};
function doMatch(p){crewOf(p.n);S.met++;S.newConn++;render();closeSheet();sheet(`<div style="text-align:center"><h2 style="margin-top:0">It is a match</h2><p>You and ${p.n} both want to play.</p><div class="row" style="justify-content:center;gap:0;margin:14px 0"><div class="av lg">${ME.i}</div><div class="av lg" style="margin-left:-14px;border:3px solid var(--bg)">${ini(p.n)}</div></div><p>${p.why}</p></div><button class="btn" style="width:100%;margin-top:12px" data-a="propose" data-v="${p.n}">Propose a game</button><button class="btn ghost" style="width:100%;margin-top:8px" data-a="chat" data-v="${p.n}">Say hi</button><button class="btn ghost" style="width:100%;margin-top:8px" data-a="close">Keep swiping</button>`)}
function sendMsg(t){const c=S.crew.find(x=>x.n===S.cv);c.msgs.push({m:1,t});render();const m=/free|week|when|time/i.test(t)?'Thursday evening works for me.':/dink|drive/i.test(t)?'Dinks all day. Soft game wins.':/court/i.test(t)?'Barton Springs and Zilker mostly.':'Sounds good!';
 setTimeout(()=>{c.msgs.push({m:0,t:m});if(S.tab==='crew'&&S.cv===c.n)render()},900)}
function chat(q){S.chat.push({h:q});S.chat.push({b:1,h:reply(q)});copilotSheet()}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;if(A[a])A[a](t.dataset,e)});
document.addEventListener('input',e=>{const el=e.target;
 if(el.id==='dcode'){let r=el.value.toUpperCase().trim();if(r.startsWith('D-')||(r.length>4&&r[0]==='D'))r=r.replace(/^D-?/,'');const v=r.replace(/[^A-Z0-9]/g,'').slice(0,4);el.value=v;S.join=v;$('#jbtn').disabled=v.length<4;return}
 const b=el.dataset.b;if(!b)return;const v=el.type==='checkbox'?el.checked:el.value;
 if(b==='ea'||b==='eb'){S.cfg[b]=v;return}
});
document.addEventListener('keydown',e=>{if(e.target.id==='dcode'&&e.key==='Enter'&&S.join.length===4)A.doJoin()});
$('#theme').addEventListener('change',e=>{document.body.dataset.theme=e.target.value});
function bindSwipe(){const c=$('#pcard');if(!c)return;let x0=null,dx=0;const sr=$('#sr'),sl=$('#sl');
 c.addEventListener('pointerdown',e=>{x0=e.clientX;c.setPointerCapture(e.pointerId)});
 c.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;sr.style.opacity=dx>0?Math.min(1,dx/90):0;sl.style.opacity=dx<0?Math.min(1,-dx/90):0});
 c.addEventListener('pointerup',()=>{if(x0===null)return;x0=null;if(dx>90)A.like();else if(dx<-90)A.pass();else{c.style.transform='';sr.style.opacity=0;sl.style.opacity=0}dx=0})}
render();
</script>
</body>
</html>
